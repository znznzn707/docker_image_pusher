name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # GitHub Actions 使用 POSIX cron，不支持 Quartz 的 ?
    # 每月 1 号 UTC 00:00 执行
    - cron: '0 0 1 * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  # 解析 images.txt，计算目标镜像名（含重名去重逻辑），产出 matrix
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build matrix from images.txt
        id: gen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          parsed = []
          temp = {}
          duplicate = set()

          with open('images.txt', encoding='utf-8') as f:
              for raw in f:
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue

                  parts = line.split()
                  platform = ''
                  if parts[0].startswith('--platform'):
                      if '=' in parts[0]:
                          platform = parts[0].split('=', 1)[1]
                      else:
                          platform = parts[1]
                  image = parts[-1].split('@')[0]

                  name_tag = image.split('/')[-1]
                  image_name = name_tag.split(':')[0]
                  seg = image.split('/')
                  if len(seg) == 3:
                      namespace = seg[1]
                  elif len(seg) == 2:
                      namespace = seg[0]
                  else:
                      namespace = ''

                  parsed.append({
                      'image': image,
                      'platform': platform,
                      'namespace': namespace,
                      'image_name': image_name,
                      'name_tag': name_tag,
                  })

                  key = namespace + '_'
                  if image_name in temp:
                      if temp[image_name] != key:
                          duplicate.add(image_name)
                  else:
                      temp[image_name] = key

          include = []
          for item in parsed:
              prefix = ''
              if item['platform']:
                  prefix += item['platform'].replace('/', '_') + '_'
              if item['image_name'] in duplicate and item['namespace']:
                  prefix += item['namespace'] + '_'
              include.append({
                  'image': item['image'],
                  'platform': item['platform'],
                  'target': prefix + item['name_tag'],
              })

          print('matrix=' + json.dumps({'include': include}))
          PY

      - name: Show matrix
        run: echo '${{ steps.gen.outputs.matrix }}' | python3 -m json.tool

  # 用 skopeo 从源 registry 流式复制到阿里云，不落地本地 docker 存储
  mirror:
    name: Mirror ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Login to Aliyun registry
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login \
            -u "$ALIYUN_REGISTRY_USER" \
            --password-stdin "$ALIYUN_REGISTRY"

      - name: Copy ${{ matrix.image }}
        env:
          SRC_IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          set -euo pipefail
          SRC="docker://${SRC_IMAGE}"
          DST="docker://${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${TARGET_NAME}"

          echo "SRC: ${SRC}"
          echo "DST: ${DST}"

          if [ -n "${PLATFORM}" ]; then
            OS_="${PLATFORM%%/*}"
            ARCH_="${PLATFORM##*/}"
            echo "single-arch: os=${OS_} arch=${ARCH_}"
            skopeo copy --retry-times 3 \
              --override-os "${OS_}" --override-arch "${ARCH_}" \
              "${SRC}" "${DST}"
          else
            echo "multi-arch: --all"
            # 目标仓库不支持 OCI index 时回退到 amd64
            skopeo copy --all --retry-times 3 "${SRC}" "${DST}" \
              || skopeo copy --retry-times 3 \
                   --override-os linux --override-arch amd64 \
                   "${SRC}" "${DST}"
          fi

      - name: Disk usage after copy
        if: always()
        run: df -hT /
